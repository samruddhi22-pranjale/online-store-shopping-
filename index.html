<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Online Store</h1>
    <input type="text" id="searchBox" placeholder="Search products..." onkeyup="searchProducts()">
    <div class="cart">Cart: <span id="cartCount">0</span></div>
</header>

<section class="categories">
    <button onclick="filterCategory('ALL')">ALL</button>
    <button onclick="filterCategory('Electronics')">Electronics</button>
    <button onclick="filterCategory('Fashion')">Fashion</button>
    <button onclick="filterCategory('Books')">Books</button>
</section>

<section class="products" id="productList"></section>

<!-- ✅ MOVE SCRIPT HERE -->
<script>
const products = [
    { name: "Laptop", price: 40000, category: "Electronics", rating: 4.5, image: "laptop.jpeg" },
    { name: "Book", price: 200, category: "Books", rating: 4.5, image: "book.jpeg" },
    { name: "Shirt", price:1000, category: "Fashion", rating: 4.2, image: "shirt.jpeg" },
    { name: "Shoes", price: 3000, category: "Fashion", rating: 4.3, image: "shoes.jpeg" },
    { name: "Headphones", price:2500, category: "Electronics", rating: 4.5, image: "headphone.jpeg" },
    { name: "Smart Watch", price:5000, category: "Electronics", rating: 4.4, image: "smartwatch.jpeg" },
    { name: "Jeans", price: 2000, category: "Fashion", rating: 4.5, image: "jeans.jpeg"},
    { name: "Jacket", price:4000, category: "Fashion", rating: 4.4, image: "jacket.jpeg" },
    { name: "Tops", price: 400, category: "Fashion", rating: 4.4, image: "tops.jpeg"},
    { name: "Fan", price:2500, category: "Electronics", rating: 4.5, image: "fan.jpeg" },
    { name: "Notebook", price: 100, category: "Books", rating: 4.3, image: "notebook.jpeg" },
    { name:"Footwear", price:600, category:"Fashion", rating:4.2, image:"footwear.jpeg"},
    { name:"Mobile", price:25000, category:"Electronics", rating:4.5, image:"mobile.jpeg"},
];

let cart = 0;

function displayProducts(productArray) {
    const container = document.getElementById("productList");
    container.innerHTML = "";

    productArray.forEach(product => {
        container.innerHTML += `
            <div class="card">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>₹${product.price}</p>
                <p>⭐ ${product.rating}</p>
                <button onclick="addToCart('${product.name}')">Add to Cart</button>
            </div>
        `;
    });
}

function addToCart(name) {
    cart++;
    document.getElementById("cartCount").innerText = cart;
}

function filterCategory(category) {
    if (category === "ALL") {
        displayProducts(products);
    } else {
        const filtered = products.filter(p => p.category === category);
        displayProducts(filtered);
    }
}

function searchProducts() {
    const searchValue = document.getElementById("searchBox").value.toLowerCase();
    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(searchValue)
    );
    displayProducts(filtered);
}

displayProducts(products);
</script>

</body>
</html>
